<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="منصة QNH الشخصية لتنظيم المهام وقوائم العمل ومؤشرات الأداء" />
    <script>
      ;(() => {
        try {
          const language = localStorage.getItem('qnh-taskhub-language') === 'en' ? 'en' : 'ar'
          document.documentElement.lang = language
          document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr'

          const storedTheme = localStorage.getItem('qnh-taskhub-theme') || 'system'
          const useDarkTheme =
            storedTheme === 'dark' ||
            (storedTheme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', useDarkTheme)
          document.documentElement.style.colorScheme = useDarkTheme ? 'dark' : 'light'
        } catch {
          // The React providers apply the safe defaults when storage is unavailable.
        }
      })()
    </script>
    <title>منصة مهام QNH</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
